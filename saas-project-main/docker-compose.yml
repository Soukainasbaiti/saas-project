version: '3.9'

services:

  # ── Base de données PostgreSQL ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    environment:
      POSTGRES_DB: project_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_saas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend Spring Boot ─────────────────────────────────────────
  backend:
    build:
      context: ./saasgestion
      dockerfile: Dockerfile
    container_name: saas_backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: postgres
      DB_PASSWORD: root
      JWT_SECRET: segula-saas-super-secret-key-2024-must-be-at-least-32-chars
      FRONTEND_URL: http://localhost
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend Angular (nginx) ────────────────────────────────────
  frontend:
    build:
      context: ./saasgestion-front
      dockerfile: Dockerfile
    container_name: saas_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
