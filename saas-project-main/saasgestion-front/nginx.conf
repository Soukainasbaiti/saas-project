server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Route toutes les URLs vers index.html (SPA Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend Spring Boot sur Railway
    location /api/ {
        proxy_pass https://saas-gestion-production.up.railway.app/api/;
        proxy_set_header Host saas-gestion-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
