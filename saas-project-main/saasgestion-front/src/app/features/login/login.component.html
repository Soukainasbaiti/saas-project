<div class="login-shell">

  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <img src="assets/logo_segula.png" alt="SEGULA Technologies" />
    </div>

    <div class="login-header">
      <h1>Espace Project Management</h1>
      <p>Connectez-vous pour accéder à votre plateforme</p>
      <div class="header-line"></div>
    </div>

    <!-- Erreur -->
    <div class="alert-error" *ngIf="errorMsg">
      <span class="alert-icon">⚠</span>
      {{ errorMsg }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <!-- Email -->
      <div class="field-group">
        <label class="field-label">Adresse email</label>
        <input
          type="email"
          class="field-input"
          formControlName="email"
          placeholder="votre@email.com"
          autocomplete="email"
          [class.invalid]="form.get('email')?.invalid && form.get('email')?.touched">
        <span class="field-error"
          *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          {{ form.get('email')?.hasError('required') ? 'Email requis' : 'Email invalide' }}
        </span>
      </div>

      <!-- Mot de passe -->
      <div class="field-group">
        <label class="field-label">Mot de passe</label>
        <div class="input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="field-input"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched">
          <button type="button" class="toggle-pw" (click)="togglePassword()">
            {{ showPassword ? '🙈' : '👁' }}
          </button>
        </div>
        <span class="field-error"
          *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          Mot de passe requis
        </span>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-login" [disabled]="loading">
        <span *ngIf="!loading">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;vertical-align:middle">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Se connecter
        </span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

    </form>

    <div class="login-footer">
      SEGULA Technologies &copy; {{ year }}
    </div>

  </div>

</div>
