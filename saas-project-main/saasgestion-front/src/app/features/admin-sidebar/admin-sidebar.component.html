<button class="sidebar-mobile-toggle" (click)="toggleMobile()" [attr.aria-label]="mobileOpen ? 'Fermer le menu' : 'Ouvrir le menu'">
  <svg *ngIf="!mobileOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  <svg *ngIf="mobileOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</button>

<div class="sidebar-backdrop" *ngIf="mobileOpen" (click)="closeMobile()"></div>

<aside class="sidebar" [class.mobile-open]="mobileOpen">

  <div class="sidebar-brand">
    <img src="assets/logo_segula.png" alt="SEGULA Technologies" class="brand-logo">
  </div>

  <nav class="sidebar-nav">
    <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-item" title="Dashboard" (click)="closeMobile()">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </span>
      <span class="nav-label">Dashboard</span>
    </a>

    <a routerLink="/admin/users" routerLinkActive="active" class="nav-item" title="Utilisateurs" (click)="closeMobile()">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </span>
      <span class="nav-label">Utilisateurs</span>
    </a>

    <a routerLink="/admin/ref-data" routerLinkActive="active" class="nav-item" title="Données de référence" (click)="closeMobile()">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
      </span>
      <span class="nav-label">Données de référence</span>
    </a>

    <a routerLink="/projects/new" routerLinkActive="active" class="nav-item" title="Nouveau Projet" (click)="closeMobile()">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </span>
      <span class="nav-label">Nouveau Projet</span>
    </a>
  </nav>

  <div class="sidebar-footer">

    <!-- Thème -->
    <div class="sidebar-section-label">Thème</div>
    <div class="theme-row">
      <button *ngFor="let t of themes"
        class="theme-dot"
        [class.active]="t.key === currentThemeKey"
        [style.background]="t.color"
        [title]="t.label"
        (click)="setTheme(t.key)">
      </button>
    </div>

    <!-- Langue -->
    <div class="sidebar-section-label" style="margin-top:10px">Langue</div>
    <button class="lang-btn" (click)="i18n.toggle()">
      <span class="lang-flag">{{ i18n.lang() === 'fr' ? '🇫🇷' : '🇬🇧' }}</span>
      <span class="lang-label">{{ i18n.lang() === 'fr' ? 'Français' : 'English' }}</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    </button>

    <!-- User card -->
    <div class="user-card">
      <div class="user-avatar">{{ auth.currentUser()?.fullName?.charAt(0) }}</div>
      <div class="user-info">
        <span class="user-name">{{ auth.currentUser()?.fullName }}</span>
        <span class="user-role">{{ auth.currentUser()?.role }}</span>
      </div>
      <button class="btn-logout" (click)="auth.logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>

  </div>

</aside>
