spring:
  application:
    name: SaaSGestion

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://localhost:5432/project_saas?preferQueryMode=simple
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: never

server:
  port: 8080
  servlet:
    context-path: /api

# ── JWT ────────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:segula-saas-super-secret-key-2024-must-be-at-least-32-chars}
    access-token-ms: 3600000
    refresh-token-ms: 604800000
  base-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:adamadrissa.07@gmail.com}
  brevo:
    api-key: ${BREVO_API_KEY:}

logging:
  level:
    root: INFO
    com.segula.saasgestion: DEBUG