spring:
  application:
    name: SaaSGestion

  datasource:
    url: jdbc:postgresql://localhost:5432/project_saas?preferQueryMode=simple
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: never

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.segula.saasgestion: DEBUG